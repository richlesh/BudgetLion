name: Build and Release Linux

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.1.0)"
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.11 for node-gyp
        # node-gyp (used to compile better-sqlite3) imports distutils, removed from
        # Python's stdlib in 3.12+. Pin 3.11 (which still has distutils).
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use a modern node-gyp for native builds
        # The node-gyp bundled with better-sqlite3 (v9) fails on current toolchains
        # (Python 3.12 removed distutils). Install a current node-gyp and make npm
        # use it for all native rebuilds.
        run: |
          npm install -g node-gyp@latest
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install ARM64 cross-compilation tools
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Inject license salt
        run: |
          echo "const LICENSE_SALT = \"${{ secrets.LICENSE_SALT }}\";" > license.js
          echo "module.exports = { LICENSE_SALT };" >> license.js

      - name: Build renderer + main
        run: npm run build

      - name: Build Linux ${{ matrix.arch }}
        run: ./node_modules/.bin/electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: BudgetLion ${{ inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*.deb
            dist/*.rpm
